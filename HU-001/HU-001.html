<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Parking - Registration</title>
    <link rel="stylesheet" href="css/HU-001.css">
</head>
<body>
<header class="header">
    <h1><span>tech</span> parking</h1>
</header>
<div class="container">
    <form id="registro-form" class="form">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="identity_document">Identity Document</label>
        <input type="text" id="identity_document" name="identity_document" required>

        <label for="email_address">Email Address</label>
        <input type="email" id="email_address" name="email_address" required>
        <p id="error-email" class="error-msg"></p>

        <div class="row">
            <div>
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number">
            </div>
            <div>
                <label for="vehicle_plate">Vehicle License Plate</label>
                <input type="text" id="vehicle_plate" name="vehicle_plate" required>
            </div>
        </div>
        <div class="row">
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
        </div>
        <div class="checks">
            <label>
                <input type="checkbox" id="terms" required>
                I accept the <span>Terms and Conditions</span>
            </label>

            <label>
                <input type="checkbox" id="privacy" required>
                I accept the <span>Privacy Policy</span>
            </label>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <div id="mensaje-feedback" class="feedback"></div>
</div>
<script src="js/HU-001.js"></script>

</body>
</html>
