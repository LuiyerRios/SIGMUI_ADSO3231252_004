<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIGMUI - Team_004</title>
    <link rel="stylesheet" href="css/HU-002.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h1>
                    <span class="highlight">Tech </span> parking
                </h1>
            </header>
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn signin-btn">Sign In</button>
                <button type="button" class="btn signup-btn">Sign Up</button>
                <a href="#" class="forgot-link">Forgot your password?</a>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>CopyRight © Team_004 - SIGMUI 2026</p>
    </footer>
    <script src="js/HU-002.js"></script>
</body>
</html>
