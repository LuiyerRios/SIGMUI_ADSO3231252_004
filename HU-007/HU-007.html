<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital fine generation</title>
    <link rel="Stylesheet" href="css/HU-007.css">
</head>
<body>
    <div class="app">
    
    <div class="header">
        <a href="HU-006.html" class="back">
        <img  src="img/flecha.png" class="back-arrow" alt="back-arrow">
        </a>
        <img src="img/Header.png" alt="Logo" class="logo">
    </div>

    <main class="content">

        <div class="section">
            <div class="status">
                ⚠️ ESTATUS: EXPIRED
                <small>The vehícle exceeded the time limit</small>
            </div>
        </div>

        <div class="section">
            <div id="plate">
                <h4>ABC276</h4>
            </div>
            <div class="info">
                <span class="label">Date:</span>
                <span class="value">February - 27 - 2026</span>
            </div>
            <div class="info">
                <span class="label">Location:</span>
                <span class="value">A1</span>
            </div>
            <div class="info">
                <span class="label">Expired:</span>
                <span class="value" style="color:red;">2:30 p.m. (1h and 40 minutes ago)</span>
            </div>
        </div>

        <div class="section">
            <label for="location">Current location</label>
            <input type="text" id="location" value="Calle 10 # 35 - 40">
        </div>

        <div class="section">
            <label for="comments">Comments (optional)</label>
            <textarea id="comments" name="comments" placeholder=" Ex: The ticket is not visible"></textarea>
        </div>

        <div class="fine">Amount of the fine
                <p>$100.000 pesos</p>
        </div>

        <div class="ticked-id">
        Ticket #: <span id="ticketNumber">----</span>
        </div>

        <button class="button">Generate Ticket #Auto</button>
        <div class="note">✅ If the registered user is not logged in
        </div>

</main>
</body>
<script src="js/HU-007.js"></script>
</html>
